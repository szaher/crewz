services:
  # PostgreSQL - Primary database for tenant schemas, users, flows, executions
  postgres:
    image: postgres:15-alpine
    container_name: crewai-postgres
    environment:
      POSTGRES_USER: crewai
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: crewai_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Secondary database for execution logs, chat history, audit logs
  mongodb:
    image: mongo:6.0
    container_name: crewai-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: crewai
      MONGO_INITDB_ROOT_PASSWORD: dev_password
      MONGO_INITDB_DATABASE: crewai_logs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Pub/Sub for execution events and caching
  redis:
    image: redis:7-alpine
    container_name: crewai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse - Analytics database for feedback and metrics
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: crewai-clickhouse
    environment:
      CLICKHOUSE_DB: crewai_analytics
      CLICKHOUSE_USER: crewai
      CLICKHOUSE_PASSWORD: dev_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/scripts/clickhouse-init.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Langfuse Web - LLM observability UI and API (using v2 for simpler local setup)
  langfuse-web:
    image: langfuse/langfuse:2
    container_name: crewai-langfuse-web
    environment:
      - DATABASE_URL=postgresql://crewai:dev_password@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=dev_langfuse_secret_change_in_production
      - SALT=dev_salt_change_in_production
      - TELEMETRY_ENABLED=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Langfuse Worker - Async processing for trace ingestion (using v2 for simpler local setup)
  langfuse-worker:
    image: langfuse/langfuse-worker:2
    container_name: crewai-langfuse-worker
    environment:
      - DATABASE_URL=postgresql://crewai:dev_password@postgres:5432/langfuse
      - SALT=dev_salt_change_in_production
      - TELEMETRY_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-web:
        condition: service_started
    restart: unless-stopped

  # Backend API - FastAPI application
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    container_name: crewai-backend
    environment:
      - ENABLE_WORKER_ARCHITECTURE=true
      - DATABASE_URL=postgresql://crewai:dev_password@postgres:5432/crewai_platform
      - MONGODB_URL=mongodb://crewai:dev_password@mongodb:27017/
      - REDIS_URL=redis://crewai-redis:6379/0
      - CELERY_BROKER_URL=redis://crewai-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://crewai-redis:6379/1
      - ENCRYPTION_KEY=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3000,http://frontend:3000,http://192.168.1.178:3001
      - ALLOWED_ORIGIN_REGEX=${ALLOWED_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1|frontend|192\.168\.[0-9]+\.[0-9]+)(:[0-9]+)?$}
      - ALLOW_ALL_ORIGINS=${ALLOW_ALL_ORIGINS:-true}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=crewai
      - CLICKHOUSE_PASSWORD=dev_password
      - CLICKHOUSE_DATABASE=crewai_analytics
      - JWT_SECRET=dev_secret_change_in_production
      - NOTIFICATIONS_ENABLED=1
      # Langfuse - LLM observability integration
      - LANGFUSE_ENABLED=true
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=pk-lf-a88d944b-a8a3-4577-a4a7-a7ddebd7a682
      - LANGFUSE_SECRET_KEY=sk-lf-f441ab83-9f87-4e94-943a-0ab073e39179
      # Toggle verbosity via env (override in your shell or .env)
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_HTTP=${LOG_HTTP:-false}
      - SQL_ECHO=${SQL_ECHO:-false}
      - UVICORN_LOG_LEVEL=${UVICORN_LOG_LEVEL:-info}
      - FRONTEND_URL=http://localhost:3000
      - ENVIRONMENT=development
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker tool execution
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: /bin/sh -lc "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --log-level ${UVICORN_LOG_LEVEL:-info}"

  # Frontend - Next.js application
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    container_name: crewai-frontend
    environment:
      # Let frontend infer API/WS host from the browser URL for LAN access
      - HOST=0.0.0.0
    ports:
      - "0.0.0.0:3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: sh -lc 'npm run dev -- -H 0.0.0.0'

  # Celery Worker - Processes async tasks (flows, crews, agents, tools)
  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: crewai-celery-worker
    environment:
      - ENABLE_WORKER_ARCHITECTURE=true
      - DATABASE_URL=postgresql://crewai:dev_password@postgres:5432/crewai_platform
      - MONGODB_URL=mongodb://crewai:dev_password@mongodb:27017/
      - REDIS_URL=redis://crewai-redis:6379/0
      - CELERY_BROKER_URL=redis://crewai-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://crewai-redis:6379/1
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=crewai
      - CLICKHOUSE_PASSWORD=dev_password
      - CLICKHOUSE_DATABASE=crewai_analytics
      - ENCRYPTION_KEY=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      # Langfuse - LLM observability integration
      - LANGFUSE_ENABLED=true
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=lf-dev-public-key
      - LANGFUSE_SECRET_KEY=lf-dev-secret-key
      - CREWAI_TELEMETRY_OPT_OUT=true
      - OTEL_SDK_DISABLED=true
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: celery -A src.workers.celery_app worker --loglevel=info --pool=gevent --concurrency=4
    restart: unless-stopped

  # Celery Beat - Periodic task scheduler for health checks
  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: crewai-celery-beat
    environment:
      - ENABLE_WORKER_ARCHITECTURE=${ENABLE_WORKER_ARCHITECTURE:-false}
      - DATABASE_URL=postgresql://crewai:dev_password@postgres:5432/crewai_platform
      - REDIS_URL=redis://crewai-redis:6379/0
      - CELERY_BROKER_URL=redis://crewai-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://crewai-redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A src.workers.celery_app beat --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local

networks:
  default:
    name: crewai-network
